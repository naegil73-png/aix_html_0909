<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type = "text" name = "age" id = "age">
    <button type="button" onclick="btn()">확인</button>
    
    <script>
        function btn(){
            var num = Number(document.getElementById("age").value);

            if (num>=18){
            alert("18세 이상 성인입니다.");}
            else{alert("18세 미만 미성년입니다.")}}
    </script>
</body>
</html>
