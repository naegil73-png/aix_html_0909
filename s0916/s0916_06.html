<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" name="age" id="age"><br>
    <button type="button" onclick="btn()">확인</button>

    <script>
        function btn(){
            var num = Number(document.getElementById("age").value);
            if (num>=18){
                alert("18세 이상 성인입니다.");}
            else{alert
                ("18세 미만 미성인입니다.")
            }
        }
        // 확인버튼 클릭 시 input에 있는 나이를 확인해서 
        //18세 이상 성인입니다. 18세 미만 미성년자입니다.
        // alert() 출력하시오. 
    </script>
</body>
</html>
