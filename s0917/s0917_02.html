<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // form폼 : csrf token > 서버에서 토큰키를 발급해서
        // 서버에서 보내준 form인지 확인
        var a = prompt("숫자를 입력하세요.");
        if (a>0){
            document.write("양수");
        }else if(a==0) document.write("0");
        else document.write("음수");

        alert(a);
    </script>
</body>
</html>

<!-- document : 현재 작업하고 있는 창을 말함. document.write 현재 창에 써라는 의미임.
if문 구조는 (){}인데, if구문이든, else if구문이든, else구문이든 1줄이면 {}는 생략 가능(2줄 이상은 불가)
prompt는 쓰지 말고, input으로 사용할 것 -->
