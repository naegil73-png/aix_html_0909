<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,th,td{border:1px solid black; border-collapse: collapse;}
        th,td{width:80px; height:40px; }
    </style>
</head>
<body>
    <input type="text" name="name" id="name" placeholder="이름입력">
    <br>
    <button type="button" onclick="saveBtn()">저장</button>

    <table>
        <tr>
            <th>이름</th>
        </tr>
        <tbody id="tbody">

        </tbody>
    </table>
    <script> 
    var arr = ["홍길동","유관순","이순신"];
    var nlist = document.getElementById("tbody").innerHTML;
    function saveBtn(){
        var name = document.getElementById("name").value;
        arr.push(name);
        document.getElementById("name").value = "";
        console.log(arr);
        nlist.innerHTML += `<tr><td>${name}</td></tr>`+nlist
    }
    
// document.getElementById("name").value = ""; 의미 : 페이지에 입력된 것을 지워라는 명령어(이게 없으면, 실행한 후에도 입력한 것이 보여짐)

        var arr = ['홍길동','유관순','이순신'];
        var txtHtml = ``;
        for(var i=0;i<arr.length;i++){
            txtHtml += `<tr><td>${arr[i]}</td></tr>`;
        }
        document.getElementById("tbody").innerHTML = txtHtml;
        /*
        var arr = [1,2]
        for(var i=0;i<arr.length;i++){
            document.write(arr[i]+"<br>");
        }
        arr.push(10);
        arr.push(9);
        arr.push(8);
        console.log("배열 : ",arr);
        arr.pop()
        console.log("배열2 : ",arr);

        console.log("길이 : ",arr.length);
        */
    </script>
</body>
</html>
