<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,th,td{ border: 1px solid black; border-collapse: collapse;}
    th,td{width: 80px; height: 50px; text-align: center;}
    </style>
</head>
<body>
    <input type="text" name="name" id="name" placeholder="이름입력"><br>
    <input type="text" name="kor" id="kor" placeholder="국어성적"><br>
    <input type="text" name="eng" id="eng" placeholder="영어성적"><br>
    <input type="text" name="math" id="math" placeholder="수학성적"><br>
    <button type="button" onclick="btn()">저장</button><br>
    <table>
        <tr>
            <th>이름</th>
            <th>국어</th>
            <th>영어</th>
            <th>수학</th>
            <th>총점</th>
            <th>평균</th>
        </tr>
        <tbody id="tbody">

        </tbody>
    </table>

    <script> 
        var arr = ["홍길동","유관순","이순신"]
        var arr_kor = [85,95,100]
        var arr_eng = [87,96,100]
        var arr_math = [87,96,100]
        var arr_total = []
        var arr_avg = []

        for(i=0;i<arr.length;i++){
            arr_total[i] = arr_kor[i]+arr_eng[i]+arr_math[i]
            arr_avg[i] = arr_total[i]/3
        }
        var nlist = document.getElementById("tbody").innerHTML;

        function btn(){
            var name = document.getElementById("name").value;
            var kor = Number(document.getElementById("kor").value);
            var eng = Number(document.getElementById("eng").value);
            var math = Number(document.getElementById("math").value);
            var total = kor+eng+math
            var avg = total/3

            arr.push(name)
            arr_kor.push(kor)
            arr_eng.push(eng)
            arr_math.push(math)
            arr_total.push(total)
            arr_avg.push(avg)

            nlist.innerHTML += `<tr><td>${name}</td><td>${kor}</td><td>${eng}</td><td>${math}</td><td>${total}</td><td>${avg}</td></tr>`
        }
        var textHtml = ``
        for(i=0;i<arr.length;i++){
            textHtml += `<tr>
                <td>${arr[i]}</td><td>${arr_kor[i]}</td><td>${arr_eng[i]}</td><td>${arr_math[i]}</td><td>${arr_total[i]}</td><td>${arr_avg[i]}</td></tr>`;}
            
        document.getElementById("tbody").innerHTML=textHtml

    </script>
</body>
</html>
