<!-- action은 이동하는 주소(url), 아이디, 패스워드를 그냥 두면 옆으로, br 넣으면 상하로 표시
placeholder는 입력창에 표시(입력하면 없어짐)하는 기능
form은 action으로 가라는 의미, value는 버튼의 이름. method(id,pw전달) : get방식은 노출, post방식은 비노출
(검색 시 경로에 정보가 노출, 비노출, 편의상 선택하되, 아이디, 비밀번호는 비노출해야 함), type = password란에 txt로 표시하면, 노출, password로 입력하면 비노출
향후에는 id, pw를 db에 넣어서 사용
<label for = "id">아이디</label>는 옆의 아이디 글자를 클릭해도 아이디 입력칸으로 들어감(for = 'id'로 연결했기 때문임, label과 input이 연결)
maxlength="="3" 입력자리가 3개, size도 지정할 수 있음
확인방법 : f12 누르고 network를 선택 -> disable cache 해제
hidden : 검색 시 보이진 않지만, 검색하면 여러 정보(IP, 주소 등)를 저장했다가 넘겨줌
