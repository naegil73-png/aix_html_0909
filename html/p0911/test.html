<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{width:500px;height: 100px; border: 1px solid black; 
        
            white-space: nowrap;
            letter-spacing: 5px;
            word-spacing: 20px;
            text-overflow: hidden;
            text-overflow: ellipsis;
            font-size:20px;
            margin-bottom:20px;
            padding-top:50px;
            }
            /* white-space(줄바꿈, 띄어쓰기, 탭 등 공백문자 처리방법, 즉, 텍스트 줄바꿈 규칙과 공백처리방식) : 
            nowrap(박스 공간을 넘어가더라도 줄바꿈하지 말고 넘어가라.)
            letter-spacing: 한글자, 한글자 간의 간격, word-spacing: 단어 간의 간격, 
            text-overflow는 이미 영역에서 벗어난 텍스트를 화면에어떻게 표현할 것인지 선택(hidden(박스 경계선 외부는 숨김), ellipsis(경계선 외부는 ..표시),
            clip: 가로방향으로 넘치는 텍스트만 숨김) */
            img{width: 10px;}
            span{font-size: 50px;}
            div:hover{
            background: yellow; cursor:pointer;
            overflow: visible;
            width: 900px;
            p{font-size: 50px;}
            }
        /* div:hover(박스 위에 마우스 올릴 때 적용할 스타일 설정을 알림), cursor:point(마우스 커서를 올렸을 때 손가락 모양으로 바꿈) */
        
    </style>
</head>
<body>
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <img src = "images/icon1.png">아이콘
    <hr>
    <p>아이콘</p>
    <div>호르무즈 이어 홍해까지 장악하나.. 후티, 홍해 연안의 주요 도시 모카 접수</div>
</body>
</html>
