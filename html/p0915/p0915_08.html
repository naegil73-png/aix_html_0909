<!DOCTYPE html>

    <style>
        /* input{background: yellow;} */
        input[type='text']{background: yellow;}
        inoput:checked+label{color:red; font-weight: 700;}
        ul li{width: 120px; height: 60px; border: 1px solid black;}
        ul li:nth-child(2){background: yellow;}
        ul li:nth-of-type(4){background: yellow;} /*동일한 부류 중에 n번째(4번째) 아이를 찾는 것, 
        p:first-child 첫번째 자식 요소 스타일 적용, p:last-child 마지막 자식 요소 스타일 적용*/
    </style>
</head>
<body>
    
    <ul>

        <p>멍충이</p>
        <li>배</li>
        <li>복숭아</li>

    </ul>
