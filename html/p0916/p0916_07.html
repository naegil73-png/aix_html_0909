<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>        
    *{margin: 0; padding: 0;}
        header{width: 100%; height: 100%; overflow: hidden;}
        img{max-width: 100%;}
        @media screen and (max-width:1200px){
            header{background: red;}
            .c2{display: none;}
            .c1{display: inline-block;}
        @media screen and (max-width:800px){
            header{background: yellow;}
            .c2{display: inline-block;}
            .c1{display: none;}
        }
        </style>
</head>
<body>
    <img class ="c1" src = "images/img_main_slide_20240612_2_pc.jpg">
    <img class ="c2" src = "images/img_main_slide_20240612_2_m.jpg">
</body>
</html>
