<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{width: 300px; height: 300px; background: blue;
        /* transition-property: all; 
        transition-duration: 1s,2s;
        transition-delay: 1s; */
        transition : all 0.5s ease-out 0.2s;}
        /* all:크기, 배경색, 테두리 등 모든 속성에 효과적용, 0.5s는 애니메이션 기간,
        ease-out : 처음에는 빨리 움직이다 갈수록 감속, 0.2s는 대기시간 */
        /* transition:all 1s linear 1s: */
        div:hover{width: 400px; height: 400px;background: red;
        border-radius: 50%;}
    </style>
</head>
<body>
    <div>

    </div>
</body>
</html>
<!-- transition timing function : 애니메이션 속도 관련 함수 -->
<!-- transition delay : 애니메이션 지연 함수 -->
<!-- transition은 마우스를 올려야 작동, animation은 자동 작동 가능 -->
