<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{width: 200px; height: 200px; background: blue;
        animation : ract 1.5s infinite alternate, background 1.5s infinite alternate;}

        @keyframes ract{
            from{transform: translate(0px) rotate(0deg);}
            to{transform: translate(500px) rotate(180deg);}}
        

        @keyframes background{
            from{background: blue;}
            50%{background: green;}
            to{background: red; border-radius: 50%;}

        }

    </style>
</head>
<body>
    <div></div>
</body>
</html>
