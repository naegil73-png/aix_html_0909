<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<>, initial-scale=1.0">
    <title>Document</title>
    <style> *{margin: 0; padding: 0;}
        section{width: 700px;height: 100px; border: 2px solid black;
        margin: 0 auto;}
        div{width: 100px; height: 60px;}
        .d1{background: blue; float: left;}
        .d2{background: yellow; float: left;}
        .d3{background: green; float: left;}
        .d4{background: pink; float: right;}
        .d5{background: gray; float: right;}
        p{width: 100px; height: 70px; background: red;}
    </style>
</head>
<body>
    <!-- css: 모양, 크기, 색상, 위치 등을 설정, 변경하는 것(스타일 태그에 넣음). html: 내용을 넣는 것(뼈대, body태그에 넣음) -->
    <section>
        <div class="d1">박스1</div>
        <div class="d2">박스2</div>
        <div class="d3">박스3</div>
        <div class="d4">박스4</div>
        <div class="d5">박스5</div>
    </section>
            <p>html 학습</p>

</body>
</html>

<!-- float하면 뒤에 요소에 반드시 영향을 받음. clear:both라고 하면 영향을 받지 않음, right는 박스의 맨 우측부터 배치됨
박스를 이동하려면 margin, padding사용했으나, position을 이용해서 이동도 가능 -->
