<!-- 페이지 내 여러개 이미지 있을 때, 각 이미지 마다 다른 사이트로 이동하게 하는 방법 :
usermap의 이름은 임의, 박스는 대각선 방향으로 점 2개면 만들 수 있음. 원형은 1개 좌표와 반지름, 다각형인 경우는 모든 좌표를 입력해야 함,
