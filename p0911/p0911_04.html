<!DOCTYPE html>

<html lang = 'en'>
    <head><meta chrset = "utf-8">
        <title>Document</title>
        <style>
            /* 태그: 해당되는 태그에 모두 설정할 때 사용하는 명령어 */
            li{font-size: 30px; color:yellow;}
            /* id는 한가지를 설정할 때 사용하는 명령어 */
            #f1{color:red;} 
            /* class는 한부류를 설정할 때 사용하는 명령어 */
            .v{color:green;}
            /* 태그, id(#), class(.)가 중복될 경우, id>class>태그 순으로 적용됨, 한가지에 id와 class 모두 지정가능하나, id만 적용, 
            한가지에 두가지 이상 class 가능, 같이 적용하려면, ul, li{} 와 같이 사용하면 됨 
            !important는 꼭 적용하라는 의미,
            표준이 아닌 명령어는 명령어 앞에 -를 붙여야 함 */
        </style>
    </head>
    
    <body>
        <ul>
            <h2>야채과일가계</h2>
            <li class = 'v' id ='f1'>사과</li>
            <li class="v">오이</li>
            <li>배</li>
            <li class='v'>상추</li>
            <li>수박</li>
            <li class='v'>감자</li>
        </ul>
        <!-- ul, h2, li에 스타일을 설정할 경우, 각각 적용할 필요 없이, ul에만 스타일 설정하면 아래의 h2, li도 적용됨  -->

    </body>


</html>
