<html lang = 'en'>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <style>
       *{margin:0;padding:0;}
    div{width:282px;height:430px; border:1px solid rgb(234,234,234);

    <body>
        <div>
            <img src ="images/1.jpg" alt = "이미지를 설명하는 속성">
        </div>
        <div>
            <img src ="images/2.jpg">
            
        </div>
        <div>
            <img src ="images/3.jpg">
        </div>
    </body>

</html>
