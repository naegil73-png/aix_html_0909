    <title>Document</title>
    <script>

            $(function(){
                // 약식 제이쿼리 선언 - 함수는 안에서 선언해야 사용할 수 있음
                // value->val(),innerText->text(),innerHTML->html()
            $("#title").text("대학성적제이쿼리");

            })
        // 원래는 이렇게 써야 하나, 약식으로 위의 형식으로 사용 가능. 기본제이쿼리 선언 : 함수는 안에서 선언해야 사용할 수 있음

    </script>
</head>
